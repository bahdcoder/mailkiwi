---
# Verify required variables
- name: verify required variables are defined
  assert:
    that:
      - pm2_version is defined
      - pm2_app_user is defined
      - pm2_app_group is defined
      - pm2_app_name is defined
      - pm2_worker_name is defined
      - pm2_base_deploy_path is defined
    msg: "Required PM2 variables must be defined"

# Install PM2
- name: install pm2 globally
  npm:
    name: pm2
    global: true
    version: "{{ pm2_version }}"
  become: true

- name: check pm2 version
  command: pm2 --version
  register: pm2_version_output
  changed_when: false

- name: verify installed pm2 version
  assert:
    that: "pm2_version_output.stdout is version('5.0.0', '>=')"
    msg: "Installed PM2 version ({{ pm2_version_output.stdout }}) is not compatible with required version"

- name: display pm2 version
  debug:
    msg: "Installed PM2 version: {{ pm2_version_output.stdout }}"

# Configure PM2 for app user
- name: configure pm2 for app user
  block:
    - name: ensure app user exists
      user:
        name: "{{ pm2_app_user }}"
        group: "{{ pm2_app_group }}"
        state: present
        system: true
        create_home: true
        shell: /bin/bash

    - name: create pm2 ecosystem config directory
      file:
        path: "/home/{{ pm2_app_user }}/.pm2"
        state: directory
        owner: "{{ pm2_app_user }}"
        group: "{{ pm2_app_group }}"
        mode: '0755'

    - name: create pm2 ecosystem config
      template:
        src: ecosystem.config.js.j2
        dest: "/home/{{ pm2_app_user }}/ecosystem.config.js"
        owner: "{{ pm2_app_user }}"
        group: "{{ pm2_app_group }}"
        mode: '0644'
  become: true

# Set up PM2 to start on boot
- name: configure pm2 startup
  block:
    - name: set pm2 to start on boot
      command: pm2 startup
      register: pm2_startup_result
      changed_when: pm2_startup_result.rc == 0

    - name: save pm2 process list
      command: pm2 save
      become_user: "{{ pm2_app_user }}"
      changed_when: true
  become: true
