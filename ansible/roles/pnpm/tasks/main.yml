---
# Verify required variables
- name: verify pnpm_version is defined
  assert:
    that: pnpm_version is defined
    msg: "pnpm_version must be defined"

- name: install pnpm globally
  npm:
    name: pnpm
    global: true
    version: "{{ pnpm_version }}"
  become: true

- name: check pnpm version
  command: pnpm --version
  register: pnpm_version_output
  changed_when: false

- name: verify installed pnpm version
  assert:
    that: "pnpm_version_output.stdout is version(pnpm_version, '>=')"
    msg: "Installed pnpm version ({{ pnpm_version_output.stdout }}) is not compatible with required version ({{ pnpm_version }})"

- name: display pnpm version
  debug:
    msg: "Installed pnpm version: {{ pnpm_version_output.stdout }}"
