---
# Verify required variables
- name: verify nodejs_version is defined
  assert:
    that: nodejs_version is defined
    msg: "nodejs_version must be defined"

# Use become block to avoid repetition
- name: install and configure nodejs
  block:
    - name: install dependencies
      apt:
        name:
          - curl
          - ca-certificates
          - gnupg
        state: present
        update_cache: true

    - name: create apt sources directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: add nodejs apt key
      shell: curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
      args:
        creates: /etc/apt/keyrings/nodesource.gpg
      changed_when: false

    - name: add nodejs repository for version {{ nodejs_version }}
      shell: echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_{{ nodejs_version.split('.')[0] }}.x nodistro main" | tee /etc/apt/sources.list.d/nodesource.list
      args:
        creates: /etc/apt/sources.list.d/nodesource.list
      changed_when: false

    - name: update apt cache
      apt:
        update_cache: true

    - name: install nodejs
      apt:
        name: nodejs
        state: present
  become: true

- name: check nodejs version
  command: node --version
  register: nodejs_version_output
  changed_when: false

- name: verify installed nodejs version
  assert:
    that: "nodejs_version_output.stdout is version(nodejs_version, '>=')"
    msg: "Installed Node.js version ({{ nodejs_version_output.stdout }}) is not compatible with required version ({{ nodejs_version }})"

- name: display nodejs version
  debug:
    msg: "Installed Node.js version: {{ nodejs_version_output.stdout }}"
