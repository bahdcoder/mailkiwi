---
# Verify required variables
- name: verify required variables are defined
  assert:
    that:
      - deploy_git_repo is defined
      - deploy_git_tag is defined and deploy_git_tag != ""
      - deploy_app_user is defined
      - deploy_app_group is defined
      - deploy_base_path is defined
      - deploy_pm2_app_name is defined
      - deploy_pm2_worker_name is defined
    msg: "Required deployment variables must be defined"

# Generate timestamp and set deployment directory
- name: generate timestamp
  set_fact:
    _deploy_timestamp: "{{ ansible_date_time.year }}-{{ ansible_date_time.month }}-{{ ansible_date_time.day }}-{{ ansible_date_time.hour }}-{{ ansible_date_time.minute }}-{{ ansible_date_time.second }}"

- name: set deployment directory
  set_fact:
    _deploy_dir: "{{ deploy_base_path }}/deployment-{{ _deploy_timestamp }}"

# Prepare deployment directories
- name: prepare deployment directories
  block:
    - name: ensure base deployment directory exists
      file:
        path: "{{ deploy_base_path }}"
        state: directory
        owner: "{{ deploy_app_user }}"
        group: "{{ deploy_app_group }}"
        mode: '0755'

    - name: create new deployment directory
      file:
        path: "{{ _deploy_dir }}"
        state: directory
        owner: "{{ deploy_app_user }}"
        group: "{{ deploy_app_group }}"
        mode: '0755'
  become: true

# Clone and build application
- name: deploy application
  block:
    - name: clone git repository with tag {{ deploy_git_tag }}
      git:
        repo: "{{ deploy_git_repo }}"
        dest: "{{ _deploy_dir }}"
        version: "{{ deploy_git_tag }}"
        force: true
      register: _git_clone_result

    - name: install dependencies with pnpm
      command: pnpm install
      args:
        chdir: "{{ _deploy_dir }}"
      register: _pnpm_install_result
      changed_when: _pnpm_install_result.rc == 0

    - name: build project
      command: pnpm build:quick
      args:
        chdir: "{{ _deploy_dir }}"
      register: _pnpm_build_result
      changed_when: _pnpm_build_result.rc == 0
  become: true
  become_user: "{{ deploy_app_user }}"

# Update symlink and restart application
- name: finalize deployment
  block:
    - name: update symlink to current deployment
      file:
        src: "{{ _deploy_dir }}"
        dest: "{{ deploy_base_path }}/current"
        state: link
        owner: "{{ deploy_app_user }}"
        group: "{{ deploy_app_group }}"
      register: _symlink_result

    - name: restart application with pm2
      command: pm2 restart {{ deploy_pm2_app_name }} {{ deploy_pm2_worker_name }} --update-env
      become_user: "{{ deploy_app_user }}"
      register: _pm2_restart_result
      changed_when: _pm2_restart_result.rc == 0
      when: _symlink_result.changed

    - name: save pm2 process list
      command: pm2 save
      become_user: "{{ deploy_app_user }}"
      register: _pm2_save_result
      changed_when: _pm2_save_result.rc == 0
      when: _symlink_result.changed

    - name: clean old deployments (keep last 5)
      shell: |
        cd {{ deploy_base_path }} && \
        ls -1dt deployment-* | tail -n +6 | xargs -r rm -rf
      become_user: "{{ deploy_app_user }}"
      args:
        executable: /bin/bash
      register: _cleanup_result
      changed_when: _cleanup_result.stdout != ""
  become: true
