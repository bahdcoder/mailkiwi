x-ubuntu-ansible: &ubuntu-ansible
  build:
    context: .
    dockerfile: docker.ubuntu.24.04.dockerfile

networks:
  kibamail_ansible_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.0.0/16

services:
  root:
    <<: *ubuntu-ansible
    hostname: ansible-root
    container_name: ansible-root
    networks:
      kibamail_ansible_network:
        ipv4_address: 172.16.0.7
    ports:
      - "2322:22"
    volumes:
      - ../..:/root/ansible
    command: tail -f /dev/null

  app-1:
    <<: *ubuntu-ansible
    hostname: ansible-app-1
    container_name: ansible-app-1
    networks:
      kibamail_ansible_network:
        ipv4_address: 172.16.0.3
    command: tail -f /dev/null

  app-2:
    <<: *ubuntu-ansible
    hostname: ansible-app-2
    container_name: ansible-app-2
    networks:
      kibamail_ansible_network:
        ipv4_address: 172.16.0.2
    command: tail -f /dev/null

  dragonfly:
    <<: *ubuntu-ansible
    hostname: ansible-dragonfly
    container_name: ansible-dragonfly
    networks:
      kibamail_ansible_network:
        ipv4_address: 172.16.0.11
    command: tail -f /dev/null

  mail-1:
    <<: *ubuntu-ansible
    hostname: ansible-mail-1
    container_name: ansible-mail-1
    networks:
      kibamail_ansible_network:
        ipv4_address: 172.16.0.10
    command: tail -f /dev/null

  mail-2:
    <<: *ubuntu-ansible
    hostname: ansible-mail-2
    container_name: ansible-mail-2
    networks:
      kibamail_ansible_network:
        ipv4_address: 172.16.0.5
    command: tail -f /dev/null

  mail-proxy:
    <<: *ubuntu-ansible
    hostname: ansible-mail-proxy
    container_name: ansible-mail-proxy
    networks:
      kibamail_ansible_network:
        ipv4_address: 172.16.0.6
    command: tail -f /dev/null

  mysql-master:
    <<: *ubuntu-ansible
    hostname: ansible-mysql-master
    container_name: ansible-mysql-master
    networks:
      kibamail_ansible_network:
        ipv4_address: 172.16.0.9
    command: tail -f /dev/null

  mysql-slave:
    <<: *ubuntu-ansible
    hostname: ansible-mysql-slave
    container_name: ansible-mysql-slave
    networks:
      kibamail_ansible_network:
        ipv4_address: 172.16.0.8
    command: tail -f /dev/null

  monitoring:
    <<: *ubuntu-ansible
    hostname: ansible-monitoring
    container_name: ansible-monitoring
    networks:
      kibamail_ansible_network:
        ipv4_address: 172.16.0.4
    command: tail -f /dev/null
