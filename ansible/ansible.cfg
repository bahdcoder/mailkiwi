[defaults]
# Default to no fact gathering because it's slow and "explicit is better than implicit"
gathering = explicit
# Default to a non-risky inventory (not production)
inventory = inventory/staging
# Disable cowsay
nocows = 1
# Point to roles directory
roles_path = ./roles
# Retry files location
retry_files_save_path = ~/.ansible/retry

[ssh_connection]
# Enable SSH multiplexing to increase performance
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
