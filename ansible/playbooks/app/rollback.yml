---
- name: rollback kibamail application
  hosts: app
  gather_facts: true

  vars_prompt:
    - name: rollback_git_tag
      prompt: "Enter the git tag to rollback to"
      private: false

  pre_tasks:
    - name: verify required variables are defined
      assert:
        that:
          - rollback_git_tag is defined and rollback_git_tag != ""
          - deploy_base_path is defined
          - deploy_app_user is defined
          - deploy_app_group is defined
          - deploy_pm2_app_name is defined
          - deploy_pm2_worker_name is defined
        msg: "Required rollback variables must be defined"

  tasks:
    - name: find deployment directory with specified tag
      shell: |
        find {{ deploy_base_path }} -maxdepth 1 -type d -name "deployment-*" -exec bash -c 'cd {} && git describe --tags' \; | grep -l "^{{ rollback_git_tag }}$" | head -1
      register: _found_deployment
      ignore_errors: true
      become: true
      become_user: "{{ deploy_app_user }}"
      changed_when: false

    - name: fail if deployment not found
      assert:
        that: _found_deployment.stdout != ""
        msg: "No deployment found with tag {{ rollback_git_tag }}"

    - name: perform rollback
      block:
        - name: update symlink to rollback deployment
          file:
            src: "{{ _found_deployment.stdout }}"
            dest: "{{ deploy_base_path }}/current"
            state: link
            owner: "{{ deploy_app_user }}"
            group: "{{ deploy_app_group }}"
          register: _symlink_result

        - name: restart application with pm2
          command: pm2 restart {{ deploy_pm2_app_name }} {{ deploy_pm2_worker_name }} --update-env
          become_user: "{{ deploy_app_user }}"
          register: _pm2_restart_result
          changed_when: _pm2_restart_result.rc == 0
          when: _symlink_result.changed

        - name: save pm2 process list
          command: pm2 save
          become_user: "{{ deploy_app_user }}"
          register: _pm2_save_result
          changed_when: _pm2_save_result.rc == 0
          when: _symlink_result.changed
      become: true
