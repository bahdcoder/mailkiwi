name: 'run command'
description: 'Runs a command'

inputs:
  command:
    description: 'Command to run'
    required: true
  name:
    description: 'Name of the step'
    required: true

runs:
  using: 'composite'
  steps:
    - name: ${{ inputs.name }}
      shell: bash
      run: ${{ inputs.command }}
