name: ansible tests

on:
  push:
    branches: [ main ]
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-tests.yml'
  workflow_dispatch:

jobs:
  ansible-tests:
    name: run ansible tests
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: install docker compose
        run: |
          DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
          mkdir -p $DOCKER_CONFIG/cli-plugins
          curl -SL https://github.com/docker/compose/releases/download/v2.23.3/docker-compose-linux-x86_64 -o $DOCKER_CONFIG/cli-plugins/docker-compose
          chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose
          sudo ln -sf $DOCKER_CONFIG/cli-plugins/docker-compose /usr/local/bin/docker-compose
          docker compose version

      - name: install ansible dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ansible/requirements.txt

      - name: lint ansible files
        run: |
          cd ansible

          ansible-lint -v || true
        continue-on-error: true

      - name: install infisical cli
        run: |
          curl -1sLf "https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh" | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical

      - name: setup infisical secrets for ansible
        run: |
          cd ansible
          ./scripts/setup-infisical.sh staging
        env:
          ANSIBLE_INFISICAL_TOKEN: ${{ secrets.ANSIBLE_INFISICAL_TOKEN }}

      - name: run ansible tests
        run: |
          cp ansible/requirements.txt ansible/tests/docker/requirements.txt
          cd ansible

          chmod +x tests/scripts/*.sh

          mkdir -p tests/logs

          mkdir -p tests/.ssh

          mkdir -p tests/docker
          chmod +x tests/docker/entrypoint.sh

          docker compose -f tests/docker/docker-compose.yml build --no-cache

          ./tests/scripts/run-tests.sh
        env:
          ANSIBLE_FORCE_COLOR: "1"
          DOCKER_BUILDKIT: "1"
