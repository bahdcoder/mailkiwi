name: ansible tests

on:
  push:
    branches: [ main ]
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-tests.yml'
  workflow_dispatch:

jobs:
  ansible-tests:
    name: run ansible tests
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: set up docker
        uses: docker/setup-buildx-action@v3

      - name: install docker compose
        run: |
          # Install Docker Compose v2
          DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
          mkdir -p $DOCKER_CONFIG/cli-plugins
          curl -SL https://github.com/docker/compose/releases/download/v2.23.3/docker-compose-linux-x86_64 -o $DOCKER_CONFIG/cli-plugins/docker-compose
          chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose
          # Create symlink for backward compatibility
          sudo ln -sf $DOCKER_CONFIG/cli-plugins/docker-compose /usr/local/bin/docker-compose
          # Verify installation
          docker compose version

      - name: cache docker images
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache
          key: ${{ runner.os }}-docker-${{ hashFiles('ansible/tests/docker/**') }}
          restore-keys: |
            ${{ runner.os }}-docker-

      - name: load cached docker images
        if: steps.cache-docker.outputs.cache-hit == 'true'
        run: |
          docker load < /tmp/docker-cache/images.tar || true

      - name: install ansible dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ansible/requirements.txt

      - name: lint ansible files
        run: |
          # Change to the ansible directory
          cd ansible

          # Run ansible-lint and save output to a file
          ansible-lint -v | tee ansible-lint-report.txt || true
        continue-on-error: true  # Don't fail the workflow on lint errors

      - name: debug environment
        run: |
          echo "Current directory: $(pwd)"
          echo "Listing ansible directory:"
          ls -la ansible/
          echo "Listing ansible/tests directory:"
          ls -la ansible/tests/
          echo "Listing ansible/tests/scripts directory:"
          ls -la ansible/tests/scripts/
          echo "Docker version:"
          docker --version
          echo "Docker Compose version:"
          docker compose version
          echo "Docker Compose v1 version:"
          docker-compose --version || echo "Docker Compose v1 not installed"

      - name: run ansible tests
        run: |
          # Change to the ansible directory
          cd ansible

          # Make scripts executable
          chmod +x tests/scripts/*.sh

          # Create logs directory
          mkdir -p tests/logs

          # Create SSH directory if it doesn't exist
          mkdir -p tests/.ssh

          # Print current directory for debugging
          echo "Current directory before running tests: $(pwd)"

          # Create a wrapper script for docker-compose to ensure it works
          cat > docker-compose-wrapper.sh << 'EOF'
          #!/bin/bash
          # Try docker compose (v2) first, then fall back to docker-compose (v1)
          docker compose "$@" || docker-compose "$@"
          EOF
          chmod +x docker-compose-wrapper.sh

          # Add the wrapper to the PATH
          export PATH="$PWD:$PATH"

          # Run the tests with increased verbosity
          ./tests/scripts/run-tests.sh
        env:
          ANSIBLE_FORCE_COLOR: "1"

      - name: save docker images to cache
        if: always()
        run: |
          # Create cache directory
          mkdir -p /tmp/docker-cache

          # Save docker images to cache
          docker images -a --filter=reference='ansible*' --format '{{.Repository}}:{{.Tag}}' | xargs docker save -o /tmp/docker-cache/images.tar || true

      - name: upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ansible-test-logs
          path: |
            ansible/tests/logs/
            ansible/tests/inventory/
            ansible/ansible-lint-report.txt
            ansible/tests/.ssh/
          retention-days: 5
